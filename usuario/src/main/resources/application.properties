spring.application.name=lajoju
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/lajoju?currentSchema=usuario}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.flyway.default-schema=${DB_SCHEMA:usuario}
spring.flyway.schemas=${DB_SCHEMA:usuario}
