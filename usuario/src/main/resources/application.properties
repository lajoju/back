spring.application.name=lajoju
server.port=${SERVER_PORT:8081}
security.jwt.private-key-location=${SECURITY_JWT_PRIVATE_KEY_LOCATION:file:../secrets/jwt-private.pem}
security.jwt.public-key-location=${SECURITY_JWT_PUBLIC_KEY_LOCATION:file:../secrets/jwt-public.pem}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lajoju?currentSchema=usuario}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.flyway.default-schema=${DB_SCHEMA:usuario}
spring.flyway.schemas=${DB_SCHEMA:usuario}
